name: Taiwan market daily dashboard
on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '強制執行（忽略非交易日檢查，用於手動測試）'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'backfill_20260821.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Historical backfill 2026-08-21
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 backfill_20260821.py
      - name: Update market data with retry
        if: github.event_name != 'push'
        shell: bash
        env:
          FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i/6"
            set +e
            python3 update.py
            code=$?
            set -e
            if [ "$code" = "0" ]; then exit 0; fi
            if [ "$code" = "2" ]; then sleep 300; else sleep 120; fi
          done
          exit 1
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json docs/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(python3 -c "import json;print(json.load(open('docs/data/latest.json')).get('trade_date','unknown'))" 2>/dev/null || echo "unknown")
            git commit -m "chore: update Taiwan market data ($DATE)"
            git push
          fi
