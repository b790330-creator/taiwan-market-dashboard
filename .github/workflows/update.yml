name: Taiwan market daily dashboard

on:
  push:
    branches:
      - main
    paths:
      - update.py
      - .github/workflows/update.yml
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '30 23 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: '強制執行（忽略非交易日檢查，用於手動測試）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        shell: bash
        env:
          FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        run: |
          set -e
          for i in 1 2 3; do
            echo "Attempt $i/3"
            set +e
            python3 update.py
            code=$?
            set -e
            if [ "$code" = "0" ]; then
              echo "update.py finished cleanly (updated, or nothing new yet)."
              exit 0
            fi
            echo "update.py exited with code $code; waiting 3 minutes before retry."
            sleep 180
          done
          echo "FAILED: update.py kept failing after 3 attempts."
          exit 1

      - name: Commit generated data
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json docs/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(python3 -c "import json; print(json.load(open('docs/data/latest.json')).get('trade_date','unknown'))")
            git commit -m "chore: update Taiwan market data ($DATE)"
            git push
          fi
