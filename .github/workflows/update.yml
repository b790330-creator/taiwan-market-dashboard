name: Taiwan market daily dashboard

on:
  push:
    branches:
      - main
    paths:
      - update.py
      - .github/workflows/update.yml
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        shell: bash
        run: |
          set -e
          for i in $(seq 1 19); do
            echo "Attempt $i/19"
            set +e
            python3 update.py
            code=$?
            set -e
            today=$(TZ=Asia/Taipei date +%F)
            saved=$(python3 -c "import json; print(json.load(open('docs/data/latest.json')).get('trade_date',''))" 2>/dev/null || true)
            echo "Target=$today Saved=$saved Exit=$code"
            if [ "$code" -eq 0 ] && [ "$saved" = "$today" ]; then
              echo "SUCCESS: market data is current for $today"
              exit 0
            fi
            if [ "$i" -lt 19 ]; then
              echo "NOT READY: waiting 5 minutes"
              sleep 300
            fi
          done
          echo "FAILED: today's market data was not published"
          exit 1

      - name: Commit generated data
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json docs/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(python3 -c "import json; print(json.load(open('docs/data/latest.json')).get('trade_date','unknown'))")
            git commit -m "chore: update Taiwan market data ($DATE)"
            git push
          fi
