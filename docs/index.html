<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b1d"><title>🌌 台股星圖｜TAIWAN MARKET</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#edf2ff;background:#050816;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;padding-bottom:76px;min-height:100vh;background-image:radial-gradient(circle at 15% 8%,#27377d55 0,transparent 28%),radial-gradient(circle at 85% 25%,#633a9a44 0,transparent 30%),radial-gradient(circle at 50% 90%,#164f6c44 0,transparent 35%),radial-gradient(circle,#ffffffbb .7px,transparent .9px);background-size:auto,auto,auto,110px 110px}.wrap{max-width:1180px;margin:auto;padding:16px}.title{font-size:30px;font-weight:900;letter-spacing:.5px;text-shadow:0 0 24px #8195ff99}.sub{color:#aab5d6;margin:6px 0 14px}.grid,.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid{grid-template-columns:repeat(4,1fr)}.card{background:linear-gradient(145deg,#18234dcc,#0d1429cc);border:1px solid #ffffff1c;border-radius:18px;padding:16px;box-shadow:0 14px 40px #0008,inset 0 1px #ffffff18;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.big{font-size:27px;font-weight:850}.label,.small{color:#9eabce;font-size:13px}.section{margin-top:16px}.section h2{font-size:19px;margin:0 0 8px}.rank-list{overflow:hidden;transition:max-height .28s ease}.rank-list.collapsed{max-height:145px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 5px;border-bottom:1px solid #ffffff12;cursor:pointer}.row:active{background:#ffffff08;border-radius:9px}.pos{color:#64e6a1;text-shadow:0 0 10px #42e89a55}.neg{color:#ff7895;text-shadow:0 0 10px #ff507055}.trendscore{font-size:42px;font-weight:950;text-shadow:0 0 25px #7f9cff88}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.nav button{border:1px solid #ffffff20;background:#111a34cc;color:#dce4ff;border-radius:999px;padding:8px 12px;white-space:nowrap;backdrop-filter:blur(8px)}.expand{width:100%;margin-top:10px;border:1px solid #ffffff18;background:#ffffff0a;color:#bfcaff;border-radius:10px;padding:9px;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#020512cc;z-index:50;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.box{background:linear-gradient(145deg,#172448f5,#0b1126f5);border:1px solid #ffffff20;width:min(650px,100%);max-height:85vh;overflow:auto;border-radius:20px;padding:20px;box-shadow:0 20px 70px #000b}.head{display:flex;justify-content:space-between;align-items:center}.close{border:1px solid #ffffff20;background:#ffffff0d;color:#fff;border-radius:50%;font-size:22px;width:36px;height:36px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.metric{background:#ffffff0a;border:1px solid #ffffff10;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}.top-btn{position:fixed;right:16px;bottom:86px;width:46px;height:46px;border:1px solid #ffffff20;border-radius:50%;background:#18254ddd;color:#fff;font-size:22px;font-weight:700;box-shadow:0 4px 20px #0008;z-index:40;display:none}.top-btn.show{display:block}.bottom-nav{display:none}@media(max-width:700px){.grid,.two{grid-template-columns:1fr 1fr}.bottom-nav{position:fixed;display:flex;left:0;right:0;bottom:0;height:64px;background:#080d20ee;border-top:1px solid #ffffff1a;box-shadow:0 -8px 28px #0009;z-index:35;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.bottom-nav button{flex:1;border:0;background:transparent;color:#aeb9dc;font-size:11px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.bottom-nav button span{font-size:19px;line-height:20px}.bottom-nav button:active{background:#ffffff0b;color:#fff}.top-btn{bottom:78px;right:14px}}@media(max-width:480px){.grid,.two,.details{grid-template-columns:1fr}.title{font-size:25px}.rank-list.collapsed{max-height:145px}}</style></head><body id="top"><main class="wrap"><div class="title">🌌 台股星圖</div><div class="sub" id="status">正在載入 2026-08-21（五）收盤資料…</div><nav class="nav"><button onclick="document.getElementById('overview').scrollIntoView()">📊 總覽</button><button onclick="document.getElementById('rank').scrollIntoView()">🔥 強弱</button><button onclick="document.getElementById('watch').scrollIntoView()">💰 資金</button><button onclick="document.getElementById('sector').scrollIntoView()">🏭 類股</button></nav><section id="overview"><div class="grid" id="cards"></div></section><section class="section two"><div class="card"><h2>🧭 市場熱度</h2><div id="trend"></div></div><div class="card"><h2>📰 公開市場資訊</h2><div id="news"></div></div></section><section class="section two" id="rank"><div class="card"><h2>🔥 漲幅 TOP 10</h2><div id="gainers"></div></div><div class="card"><h2>📉 跌幅 TOP 10</h2><div id="losers"></div></div></section><section class="section two" id="watch"><div class="card"><h2>💰 成交金額 TOP 10</h2><div id="active"></div></div><div class="card"><h2>🔄 成交量 TOP 10</h2><div id="volume"></div></div></section><section class="section two" id="sector"><div class="card"><h2>🏭 強勢類股</h2><div id="up"></div></div><div class="card"><h2>⚠️ 弱勢類股</h2><div id="down"></div></div></section><p class="small">資料來源：臺灣證券交易所 OpenAPI。公開市場資訊，僅供資訊參考，不構成投資建議。</p></main><button id="topBtn" class="top-btn" aria-label="回到最上面" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button><nav class="bottom-nav" aria-label="手機快速導覽"><button onclick="document.getElementById('overview').scrollIntoView({behavior:'smooth'})"><span>📊</span>總覽</button><button onclick="document.getElementById('rank').scrollIntoView({behavior:'smooth'})"><span>🔥</span>強勢</button><button onclick="document.getElementById('watch').scrollIntoView({behavior:'smooth'})"><span>💰</span>資金</button><button onclick="document.getElementById('sector').scrollIntoView({behavior:'smooth'})"><span>🏭</span>類股</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>↑</span>頂部</button></nav><div class="modal" id="modal"><div class="box"><div class="head"><h2 id="mtitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div><script>(async()=>{const $=id=>document.getElementById(id);const topBtn=$('topBtn');window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>300),{passive:true});const n=(x,d=2)=>Number.isFinite(Number(x))?Number(x).toLocaleString('zh-TW',{maximumFractionDigits:d}):'—';const p=x=>Number.isFinite(Number(x))?(Number(x)>=0?'+':'')+Number(x).toFixed(2)+'%':'—';const c=x=>Number(x)>0?'pos':Number(x)<0?'neg':'';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function modal(s){$('mtitle').textContent=s.code+' '+s.name;$('mbody').innerHTML='<div class="details"><div class="metric"><span class="small">收盤價</span><b>'+n(s.close)+'</b></div><div class="metric"><span class="small">漲跌幅</span><b class="'+c(s.pct)+'">'+p(s.pct)+'</b></div><div class="metric"><span class="small">漲跌</span><b class="'+c(s.change)+'">'+n(s.change)+'</b></div><div class="metric"><span class="small">成交金額</span><b>'+(Number(s.value)>0?n(Number(s.value)/1e8,1)+' 億':'—')+'</b></div><div class="metric"><span class="small">成交股數</span><b>'+(Number(s.volume)>0?n(s.volume,0):'—')+'</b></div></div><p class="small">2026-08-21 14:30 公開收盤快照。</p>';$('modal').classList.add('show')}window.closeModal=()=>$('modal').classList.remove('show');function rows(a,value=false){return(a||[]).map((s,i)=>'<div class="row"><span><b>'+esc(s.code)+'</b> '+esc(s.name)+'</span><span class="'+c(s.pct)+'">'+(value?(Number(s.value)>0?n(Number(s.value)/1e8,1)+' 億':'—'):p(s.pct))+'</span></div>').join('')}function bind(id,a,value){const el=$(id);el.innerHTML='<div class="rank-list collapsed">'+rows(a,value)+'</div><button class="expand" type="button">⌄ 展開全部 TOP 10</button>';const list=el.querySelector('.rank-list'),btn=el.querySelector('.expand');[...list.querySelectorAll('.row')].forEach((row,i)=>row.onclick=()=>modal(a[i]));btn.onclick=()=>{const open=!list.classList.contains('collapsed');list.classList.toggle('collapsed',open);btn.textContent=open?'⌄ 展開全部 TOP 10':'⌃ 收合 TOP 10'}}function render(d){let m=d.market,i=m.index;$('status').textContent=d.trade_date+'｜14:30 收盤｜公開市場資料';$('cards').innerHTML='<div class="card"><div class="label">加權指數</div><div class="big">'+n(i.close)+'</div><div class="'+c(i.pct)+'">'+n(i.change)+' 點　'+p(i.pct)+'</div></div><div class="card"><div class="label">成交金額</div><div class="big">'+n(m.turnover_billion,0)+' 億</div></div><div class="card"><div class="label">上漲 / 下跌</div><div class="big">'+m.up+' / '+m.down+'</div><div class="small">共 '+m.stocks+' 檔</div></div><div class="card"><div class="label">市場熱度</div><div class="big">'+d.trend.score+'/100</div><div class="small">'+esc(d.trend.label)+'</div></div>';$('trend').innerHTML='<div class="trendscore">'+d.trend.score+'</div><b>'+esc(d.trend.label)+'</b>'+(d.trend.reasons||[]).slice(0,4).map(x=>'<div>• '+esc(x)+'</div>').join('');$('news').innerHTML=(d.news||[]).map(x=>'<div class="row"><span>'+esc(x.title)+'</span></div>').join('')||'<div class="small">目前沒有公開新聞資料</div>';bind('gainers',d.gainers);bind('losers',d.losers);bind('active',d.active,true);let volume=[...(d.stocks||[])].sort((a,b)=>(Number(b.volume)||0)-(Number(a.volume)||0)).slice(0,10);bind('volume',volume);$('up').innerHTML=(d.sectors_up||[]).map(s=>'<div class="row"><span>'+esc(s.name)+'</span><span class="pos">'+p(s.pct)+'</span></div>').join('');$('down').innerHTML=(d.sectors_down||[]).map(s=>'<div class="row"><span>'+esc(s.name)+'</span><span class="neg">'+p(s.pct)+'</span></div>').join('')}async function get(path){const r=await fetch(path+'?v=20260822c',{cache:'no-store'});if(!r.ok)throw Error(path+' '+r.status);return r.json()}try{render(await get('./data/latest.json'))}catch(e){try{render(await get('./data/2026-08-21.json'))}catch(x){$('status').textContent='資料載入失敗：請確認 GitHub Pages 部署狀態。'}}})();</script></body></html>
