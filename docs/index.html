<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股收盤後儀表板</title><style>html{scroll-behavior:smooth}body{margin:0;background:#f4f6f8;color:#18212f;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:16px}.title{font-size:28px;font-weight:800}.sub{color:#667085;margin:6px 0 14px}.grid,.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000008}.big{font-size:27px;font-weight:800}.label,.small{color:#667085;font-size:13px}.section{margin-top:16px}.section h2{font-size:19px;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}.pos{color:#16803c}.neg{color:#c62828}.trendscore{font-size:40px;font-weight:900}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.nav button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.box{background:#fff;width:min(650px,100%);max-height:85vh;overflow:auto;border-radius:18px;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;font-size:22px;width:36px;height:36px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.metric{background:#f6f8fa;border-radius:10px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}.top-btn{position:fixed;right:16px;bottom:20px;width:48px;height:48px;border:0;border-radius:50%;background:#18212f;color:#fff;font-size:22px;font-weight:700;box-shadow:0 4px 14px #0003;z-index:20;display:none;cursor:pointer}.top-btn.show{display:block}.top-btn:active{transform:scale(.94)}@media(max-width:700px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.two,.details{grid-template-columns:1fr}.title{font-size:24px}.top-btn{right:14px;bottom:16px}}</style></head><body id="top"><main class="wrap"><div class="title">📈 台股收盤後儀表板</div><div class="sub" id="status">正在載入 2026-08-21（五）收盤資料…</div><nav class="nav"><button onclick="document.getElementById('overview').scrollIntoView()">總覽</button><button onclick="document.getElementById('rank').scrollIntoView()">強弱股</button><button onclick="document.getElementById('watch').scrollIntoView()">自選股</button><button onclick="document.getElementById('sector').scrollIntoView()">類股</button></nav><section id="overview"><div class="grid" id="cards"></div></section><section class="section two"><div class="card"><h2>🧭 今日趨勢思考</h2><div id="trend"></div></div><div class="card"><h2>📰 今日新聞</h2><div id="news"></div></div></section><section class="section two" id="rank"><div class="card"><h2>🔥 漲幅前 10</h2><div id="gainers"></div></div><div class="card"><h2>📉 跌幅前 10</h2><div id="losers"></div></div></section><section class="section two" id="watch"><div class="card"><h2>💰 成交金額前 10</h2><div id="active"></div></div><div class="card"><h2>👀 關注清單</h2><div id="watchlist"></div></div></section><section class="section two" id="sector"><div class="card"><h2>🏭 強勢類股</h2><div id="up"></div></div><div class="card"><h2>⚠️ 弱勢類股</h2><div id="down"></div></div></section><p class="small">資料來源：臺灣證券交易所 OpenAPI。僅供資訊參考，不構成投資建議。</p></main><button id="topBtn" class="top-btn" aria-label="回到最上面" title="回到最上面" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button><div class="modal" id="modal"><div class="box"><div class="head"><h2 id="mtitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div><script>(async()=>{const $=id=>document.getElementById(id);const topBtn=$('topBtn');window.addEventListener('scroll',()=>{topBtn.classList.toggle('show',window.scrollY>300)},{passive:true});const n=(x,d=2)=>Number.isFinite(Number(x))?Number(x).toLocaleString('zh-TW',{maximumFractionDigits:d}):'—';const p=x=>Number.isFinite(Number(x))?(Number(x)>=0?'+':'')+Number(x).toFixed(2)+'%':'—';const c=x=>Number(x)>0?'pos':Number(x)<0?'neg':'';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function modal(s){$('mtitle').textContent=s.code+' '+s.name;$('mbody').innerHTML='<div class="details"><div class="metric"><span class="small">收盤價</span><b>'+n(s.close)+'</b></div><div class="metric"><span class="small">漲跌幅</span><b class="'+c(s.pct)+'">'+p(s.pct)+'</b></div><div class="metric"><span class="small">漲跌</span><b class="'+c(s.change)+'">'+n(s.change)+'</b></div><div class="metric"><span class="small">成交金額</span><b>'+(Number(s.value)>0?n(Number(s.value)/1e8,1)+' 億':'—')+'</b></div><div class="metric"><span class="small">成交股數</span><b>'+(Number(s.volume)>0?n(s.volume,0):'—')+'</b></div></div><p class="small">昨日 2026-08-21 收盤快照。</p>';$('modal').classList.add('show')}window.closeModal=()=>{$('modal').classList.remove('show')};function rows(a,value=false){return (a||[]).map((s,i)=>'<div class="row" data-i="'+i+'"><span><b>'+esc(s.code)+'</b> '+esc(s.name)+'</span><span class="'+c(s.pct)+'">'+(value?(Number(s.value)>0?n(Number(s.value)/1e8,1)+' 億':'—'):p(s.pct))+'</span></div>').join('')}function render(d){let m=d.market,i=m.index;$('status').textContent=d.trade_date+'（五）｜14:30 收盤｜資料更新 '+new Date(d.generated_at).toLocaleString('zh-TW');$('cards').innerHTML='<div class="card"><div class="label">加權指數</div><div class="big">'+n(i.close)+'</div><div class="'+c(i.pct)+'">'+n(i.change)+' 點　'+p(i.pct)+'</div></div><div class="card"><div class="label">成交金額</div><div class="big">'+n(m.turnover_billion,0)+' 億</div></div><div class="card"><div class="label">上漲 / 下跌</div><div class="big">'+m.up+' / '+m.down+'</div><div class="small">共 '+m.stocks+' 檔</div></div><div class="card"><div class="label">市場趨勢</div><div class="big">'+esc(d.trend.label)+'</div><div class="small">分數 '+d.trend.score+'/100</div></div>';$('trend').innerHTML='<div class="trendscore">'+d.trend.score+'</div><b>'+esc(d.trend.label)+'</b>'+(d.trend.reasons||[]).slice(0,4).map(x=>'<div>• '+esc(x)+'</div>').join('');$('news').innerHTML=(d.news||[]).map(x=>'<div class="row"><span>'+esc(x.title)+'</span></div>').join('')||'<div class="small">目前沒有新聞</div>';const groups=[['gainers',d.gainers],['losers',d.losers],['active',d.active],['watchlist',d.watchlist]];groups.forEach(([id,a])=>{$(id).innerHTML=rows(a,id==='active');[...$(id).querySelectorAll('.row')].forEach((el,i)=>el.onclick=()=>modal(a[i]))});$('up').innerHTML=(d.sectors_up||[]).map(s=>'<div class="row"><span>'+esc(s.name)+'</span><span class="pos">'+p(s.pct)+'</span></div>').join('');$('down').innerHTML=(d.sectors_down||[]).map(s=>'<div class="row"><span>'+esc(s.name)+'</span><span class="neg">'+p(s.pct)+'</span></div>').join('')}async function get(path){const r=await fetch(path+'?v=20260822',{cache:'no-store'});if(!r.ok)throw Error(path+' '+r.status);return await r.json()}try{render(await get('./data/latest.json'))}catch(e){try{render(await get('./data/2026-08-21.json'))}catch(x){$('status').textContent='資料載入失敗：請確認 GitHub Pages 部署狀態。'}}})();</script></body></html>
