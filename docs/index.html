<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股收盤後儀表板</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:#18212f;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:20px}.title{font-size:30px;font-weight:800}.sub{color:#667085;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000008}.big{font-size:28px;font-weight:800}.label{color:#667085;font-size:13px}.pos{color:#16803c}.neg{color:#c62828}.neutral{color:#667085}.section{margin-top:18px}.section h2{font-size:20px;margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.tag{padding:3px 8px;border-radius:999px;background:#eef2f6;font-size:12px}.news a{color:#1d4ed8;text-decoration:none}.small{font-size:13px;color:#667085}.score{font-size:42px;font-weight:900}.reason{padding:8px 0}.footer{margin-top:24px;font-size:12px;color:#7a8491}@media(max-width:800px){.grid,.two{grid-template-columns:1fr 1fr}.top{display:block}}@media(max-width:520px){.grid,.two{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">📈 台股收盤後儀表板</div><div class="sub" id="subtitle">載入中…</div></div><div class="tag">TWSE OpenAPI</div></div><div class="grid" id="cards"></div><div class="section two"><div class="card"><h2>🧭 今日趨勢思考</h2><div id="trend"></div></div><div class="card"><h2>📰 今日證交所新聞</h2><div id="news" class="news"></div></div></div><div class="section two"><div class="card"><h2>🔥 漲幅前 10</h2><div id="gainers"></div></div><div class="card"><h2>📉 跌幅前 10</h2><div id="losers"></div></div></div><div class="section two"><div class="card"><h2>💰 成交金額前 10</h2><div id="active"></div></div><div class="card"><h2>👀 關注清單</h2><div id="watch"></div></div></div><div class="section two"><div class="card"><h2>🏭 強勢類股</h2><div id="sectors-up"></div></div><div class="card"><h2>⚠️ 弱勢類股</h2><div id="sectors-down"></div></div></div><div class="footer">資料來源：臺灣證券交易所 OpenAPI。趨勢分數僅為統計摘要，不構成投資建議。</div></div><script>const f=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:d}):'—';const pct=n=>Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}%`:'—';const cls=n=>n>0?'pos':n<0?'neg':'neutral';const row=(s,k)=>`<div class="row"><span><b>${s.code||''}</b> ${s.name||s.title||''}</span><span class="${cls(s.pct)}">${k==='value'?f(s.value/1e8,1)+' 億':pct(s.pct)}</span></div>`;fetch('./data/latest.json?'+Date.now()).then(r=>r.json()).then(d=>{const m=d.market,i=m.index;document.getElementById('subtitle').textContent=`${d.trade_date}｜更新 ${new Date(d.generated_at).toLocaleString('zh-TW')}`;document.getElementById('cards').innerHTML=`<div class="card"><div class="label">加權指數</div><div class="big">${f(i.close)}</div><div class="${cls(i.pct)}">${f(i.change)} 點　${pct(i.pct)}</div></div><div class="card"><div class="label">成交金額</div><div class="big">${f(m.turnover_billion,0)} 億</div><div class="small">上市市場</div></div><div class="card"><div class="label">上漲 / 下跌 / 平盤</div><div class="big">${m.up} / ${m.down} / ${m.unchanged}</div><div class="small">共 ${m.stocks} 檔</div></div><div class="card"><div class="label">市場趨勢</div><div class="big">${d.trend.label}</div><div class="small">分數 ${d.trend.score}/100</div></div>`;document.getElementById('trend').innerHTML=`<div class="score">${d.trend.score}<span class="small"> / 100</span></div><b>${d.trend.label}</b>${d.trend.reasons.map(x=>`<div class="reason">• ${x}</div>`).join('')}`;document.getElementById('news').innerHTML=d.news?.length?d.news.slice(0,8).map(n=>`<div class="row"><span>${n.link?`<a href="${n.link}" target="_blank" rel="noopener">${n.title}</a>`:n.title}</span></div>`).join(''):'<div class="small">目前沒有抓到新聞。</div>';document.getElementById('gainers').innerHTML=d.gainers.map(s=>row(s,'pct')).join('');document.getElementById('losers').innerHTML=d.losers.map(s=>row(s,'pct')).join('');document.getElementById('active').innerHTML=d.active.map(s=>row(s,'value')).join('');document.getElementById('watch').innerHTML=d.watchlist?.length?d.watchlist.map(s=>row(s,'pct')).join(''):'<div class="small">尚未有關注清單資料。</div>';document.getElementById('sectors-up').innerHTML=d.sectors_up.map(s=>`<div class="row"><span>${s.name}</span><span class="pos">${pct(s.pct)}</span></div>`).join('');document.getElementById('sectors-down').innerHTML=d.sectors_down.map(s=>`<div class="row"><span>${s.name}</span><span class="neg">${pct(s.pct)}</span></div>`).join('')}).catch(e=>document.getElementById('subtitle').textContent='尚未完成第一次收盤資料更新；GitHub Actions 執行後會自動出現。');</script></body></html>
